<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול לקוחות והזמנות</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>מערכת ניהול לקוחות והזמנות</h1>
        
        <!-- טבלת לקוחות -->
        <div class="section">
            <h2>לקוחות</h2>
            <button id="addCustomerBtn" class="btn btn-primary">הוסף לקוח חדש</button>
            <table id="customersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>שם</th>
                        <th>אימייל</th>
                        <th>טלפון</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="customersTableBody">
                    <!-- לקוחות יוצגו כאן -->
                </tbody>
            </table>
        </div>

        <!-- טבלת הזמנות -->
        <div class="section">
            <h2>הזמנות</h2>
            <button id="addOrderBtn" class="btn btn-primary">הוסף הזמנה חדשה</button>
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>מספר הזמנה</th>
                        <th>לקוח ID</th>
                        <th>תאריך הזמנה</th>
                        <th>סכום כולל</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <!-- הזמנות יוצגו כאן -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal להוספת/עריכת לקוח -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="customerModalTitle">הוסף לקוח חדש</h3>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-group">
                    <label for="customerName">שם:</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label for="customerEmail">אימייל:</label>
                    <input type="email" id="customerEmail" required>
                </div>
                <div class="form-group">
                    <label for="customerPhone">טלפון:</label>
                    <input type="text" id="customerPhone">
                </div>
                <button type="submit" class="btn btn-success">שמור</button>
                <button type="button" class="btn btn-secondary" onclick="closeCustomerModal()">ביטול</button>
            </form>
        </div>
    </div>

    <!-- Modal להוספת הזמנה -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>הוסף הזמנה חדשה</h3>
            <form id="orderForm">
                <div class="form-group">
                    <label for="orderCustomerId">לקוח ID:</label>
                    <input type="number" id="orderCustomerId" required>
                </div>
                <div class="form-group">
                    <label for="orderDate">תאריך הזמנה:</label>
                    <input type="datetime-local" id="orderDate" required>
                </div>
                <div class="form-group">
                    <label for="orderAmount">סכום כולל:</label>
                    <input type="number" id="orderAmount" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-success">שמור</button>
                <button type="button" class="btn btn-secondary" onclick="closeOrderModal()">ביטול</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
