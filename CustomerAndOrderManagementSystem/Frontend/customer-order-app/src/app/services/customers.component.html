<div class="section">
    <h2>לקוחות</h2>
    <button (click)="openModal()" class="btn btn-primary">הוסף לקוח חדש</button>
    
    <table id="customersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>שם</th>
                <th>אימייל</th>
                <th>טלפון</th>
                <th>פעולות</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let customer of customers">
                <td>{{ customer.id }}</td>
                <td>{{ customer.name }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone }}</td>
                <td>
                    <button class="btn-edit" (click)="openModal(customer)">ערוך</button>
                </td>
            </tr>
            <tr *ngIf="customers.length === 0">
                <td colspan="5">אין לקוחות להצגה</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal" *ngIf="isModalOpen" style="display: block; background-color: rgba(0,0,0,0.5);">
    <div class="modal-content">
        <span class="close" (click)="closeModal()">&times;</span>
        <h3>{{ isEditMode ? 'ערוך לקוח' : 'הוסף לקוח חדש' }}</h3>
        
        <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="customerName">שם:</label>
                <input type="text" id="customerName" formControlName="name">
            </div>
            <div class="form-group">
                <label for="customerEmail">אימייל:</label>
                <input type="email" id="customerEmail" formControlName="email">
            </div>
            <div class="form-group">
                <label for="customerPhone">טלפון:</label>
                <input type="text" id="customerPhone" formControlName="phone">
            </div>
            <button type="submit" class="btn btn-success">שמור</button>
            <button type="button" class="btn btn-secondary" (click)="closeModal()">ביטול</button>
        </form>
    </div>
</div>
