<div class="section">
    <h2>הזמנות</h2>
    <button (click)="openModal()" class="btn btn-primary">הוסף הזמנה חדשה</button>
    
    <table id="ordersTable">
        <thead>
            <tr>
                <th>מספר הזמנה</th>
                <th>לקוח ID</th>
                <th>תאריך הזמנה</th>
                <th>סכום כולל</th>
            </tr>
        </thead>
        <tbody>
            <!-- לולאה שרצה על כל ההזמנות ומציגה אותן -->
            <tr *ngFor="let order of orders">
                <td>{{ order.orderId }}</td>
                <td>{{ order.customerId }}</td>
                <!-- ה-pipe שנקרא date מעצב את התאריך יפה -->
                <td>{{ order.orderDate | date:'short' }}</td>
                <!-- ה-pipe שנקרא currency מוסיף סימן ש"ח -->
                <td>{{ order.totalAmount | currency:'ILS' }}</td>
            </tr>
            <tr *ngIf="orders.length === 0">
                <td colspan="4">אין הזמנות להצגה</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- חלון קופץ (Modal) להוספת הזמנה -->
<div class="modal" *ngIf="isModalOpen" style="display: block; background-color: rgba(0,0,0,0.5);">
    <div class="modal-content">
        <span class="close" (click)="closeModal()">&times;</span>
        <h3>הוסף הזמנה חדשה</h3>
        <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="orderCustomerId">לקוח ID:</label>
                <input type="number" id="orderCustomerId" formControlName="customerId">
            </div>
            <div class="form-group">
                <label for="orderDate">תאריך הזמנה:</label>
                <input type="datetime-local" id="orderDate" formControlName="orderDate">
            </div>
            <div class="form-group">
                <label for="orderAmount">סכום כולל:</label>
                <input type="number" id="orderAmount" step="0.01" formControlName="totalAmount">
            </div>
            <button type="submit" class="btn btn-success">שמור</button>
            <button type="button" class="btn btn-secondary" (click)="closeModal()">ביטול</button>
        </form>
    </div>
</div>
