# ---------------------------------------------------------------------------
# Render Blueprint — deploys the Phoenix RAG Bot (backend + frontend) from one
# repo. Push to GitHub, then in Render: New ▸ Blueprint ▸ pick the repo.
# After the first deploy, set the GEMINI_API_KEY secrets in the backend
# service's "Environment" tab (they are intentionally NOT stored in this file).
# ---------------------------------------------------------------------------
services:
  # --- Backend: FastAPI + ChromaDB (Python web service) --------------------
  - type: web
    name: phoenix-backend
    rootDir: phoenix-rag-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PHOENIX_TENANT_CONFIG
        value: config/phoenix.yaml
      # Scheduled re-crawl is OFF by default (set to "true" to enable in-process
      # weekly re-crawl per config/phoenix.yaml recrawl_schedule).
      - key: PHOENIX_ENABLE_SCHEDULER
        value: "false"
      # Public read-only demo: allow any origin.
      - key: PHOENIX_CORS_ORIGINS
        value: "*"
      # Gemini keys are SECRETS — add them in the Render dashboard, not here.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false

  # --- Frontend: React SPA served as a static site -------------------------
  - type: web
    name: phoenix-frontend
    rootDir: phoenix-rag-bot
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://phoenix-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://phoenix-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
