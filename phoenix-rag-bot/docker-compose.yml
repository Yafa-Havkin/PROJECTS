# Phoenix RAG Bot — full stack (backend + frontend) in one command:
#   docker compose up --build
# Then open http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: phoenix-backend
    env_file:
      - .env
    environment:
      PHOENIX_TENANT_CONFIG: config/phoenix.yaml
      PHOENIX_CORS_ORIGINS: "*"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: phoenix-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped
