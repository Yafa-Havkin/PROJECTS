<div class="add-equipment-container">
  <h2>Add New Equipment</h2>

  <form (ngSubmit)="onSubmit()" #equipmentForm="ngForm">
    <div class="form-group">
      <label for="name">Equipment Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="equipment.name"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select
        id="status"
        name="status"
        [(ngModel)]="equipment.status"
        required
        class="form-control"
      >
        <option value="Available">Available</option>
        <option value="Loaned">Loaned</option>
        <option value="UnderRepair">Under Repair</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          name="isAvailableForLoan"
          [(ngModel)]="equipment.isAvailableForLoan"
        />
        Available for Loan
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="!equipmentForm.valid">
        Add Equipment
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
