<div class="create-loan-container">
  <h2>Create New Loan</h2>

  <form (ngSubmit)="onSubmit()" #loanForm="ngForm">
    <div class="form-group">
      <label for="equipmentId">Equipment:</label>
      <select
        id="equipmentId"
        name="equipmentId"
        [(ngModel)]="loan.equipmentId"
        required
        class="form-control"
      >
        <option value="0" disabled>Select Equipment</option>
        <option *ngFor="let item of availableEquipment" [value]="item.id">
          {{ item.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="employeeId">Employee ID:</label>
      <input
        type="number"
        id="employeeId"
        name="employeeId"
        [(ngModel)]="loan.employeeId"
        required
        min="1"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="managerId">Manager ID:</label>
      <input
        type="number"
        id="managerId"
        name="managerId"
        [(ngModel)]="loan.managerId"
        required
        min="1"
        class="form-control"
      />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="!loanForm.valid">
        Create Loan
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
